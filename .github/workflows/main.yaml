# Continuous integration: on every push to main and every pull request,
# check that the code is formatted, lint-free and passes its tests, on Linux
# and on macOS (there with Apple's Accelerate library, the blas feature),
# and that PLAN.md's table of contents and links are current. `make test`
# runs the same checks locally; keep the two in step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: macos-latest
            features: "--features blas"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: diffusion
      - name: Formatting
        run: cargo fmt --manifest-path diffusion/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --release --manifest-path diffusion/Cargo.toml --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        run: cargo test --release --manifest-path diffusion/Cargo.toml ${{ matrix.features }}
      - name: Build and run
        run: |
          cargo build --release --manifest-path diffusion/Cargo.toml ${{ matrix.features }}
          diffusion/target/release/diffusion info

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pip install pylint==4.1.3
          pylint tools/*.py
      - name: PLAN.md's table of contents and internal links
        run: python3 tools/toc.py --check PLAN.md
